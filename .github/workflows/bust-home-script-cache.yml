name: Refresh homepage script cache key

on:
  push:
    branches:
      - cdg-doctor-site
    paths:
      - '.github/workflows/bust-home-script-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdg-doctor-site
          fetch-depth: 0
      - name: Version homepage script
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|<script defer src="script.js"></script>|<script defer src="script.js?v=healthcheck2"></script>|' index.html
          grep -q 'script.js?v=healthcheck2' index.html
          rm -f .github/workflows/bust-home-script-cache.yml
      - name: Commit cache key
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh homepage script for Full Health Check example'
          git push origin HEAD:cdg-doctor-site
