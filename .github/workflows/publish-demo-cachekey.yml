name: Refresh homepage demo cache key

on:
  push:
    branches:
      - cdg-doctor-site
    paths:
      - '.github/workflows/publish-demo-cachekey.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdg-doctor-site
          fetch-depth: 0
      - name: Update cache key and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'script.js?v=healthcheck-fullres'
          new = 'script.js?v=demo-video1'
          if old not in s and new not in s:
              raise SystemExit('Expected script cache key not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/publish-demo-cachekey.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish CDG Doctor video demo'
          git push origin HEAD:cdg-doctor-site
