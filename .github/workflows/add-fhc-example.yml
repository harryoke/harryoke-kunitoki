name: Add Full Health Check example to homepage

on:
  push:
    branches:
      - cdg-doctor-site
    paths:
      - '.github/workflows/add-fhc-example.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: cdg-doctor-site
          fetch-depth: 0

      - name: Insert Example 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          snippet = Path('assets/examples/full-health-check-example-snippet.html').read_text(encoding='utf-8')
          marker = '      <p class="repair-examples-note reveal"><b>REAL OUTPUT</b>'
          if 'EXAMPLE 2 · FULL HEALTH CHECK REPAIR' not in s:
              if marker not in s:
                  raise SystemExit('repair examples marker not found')
              s = s.replace(marker, snippet + marker, 1)
          old_note = 'These are lossless web copies made from the original 1152 × 768 screenshots supplied from the repair workflow, with no visual retouching.'
          new_note = 'These are real repair-workflow screenshots with no visual retouching. The CD+G frame examples are lossless web copies; the full CDG Doctor interface screenshots are web-optimised for faster loading.'
          s = s.replace(old_note, new_note)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'EXAMPLE 2 · FULL HEALTH CHECK REPAIR' script.js
          grep -q 'full-health-check-before.webp' script.js
          grep -q 'full-health-check-after.webp' script.js

      - name: Clean patch helper files
        shell: bash
        run: |
          rm -f assets/examples/full-health-check-example-snippet.html
          rm -f .github/workflows/add-fhc-example.yml

      - name: Commit homepage update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show Full Health Check interface before and after example'
          git push origin HEAD:cdg-doctor-site
