name: Publish Full Resolution Health Check Screenshots

on:
  push:
    branches:
      - cdg-doctor-site
    paths:
      - '.github/workflows/publish-fhc-fullres.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdg-doctor-site
          fetch-depth: 0

      - name: Switch Example 2 to full resolution
        shell: python
        run: |
          from pathlib import Path

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/examples/full-health-check-before.webp', 'assets/examples/full-health-check-before-fullres.webp')
          s = s.replace('assets/examples/full-health-check-after.webp', 'assets/examples/full-health-check-after-fullres.webp')
          s = s.replace('width="640" height="344" loading="lazy" style="aspect-ratio:80/43"', 'width="1920" height="1032" loading="lazy" style="aspect-ratio:240/129"')
          s = s.replace('the full CDG Doctor interface screenshots are web-optimised for faster loading.', 'the full CDG Doctor interface screenshots are full-resolution lossless 1920 × 1032 copies.')
          if 'full-health-check-before-fullres.webp' not in s or 'full-health-check-after-fullres.webp' not in s:
              raise SystemExit('Full-resolution image references were not applied')
          if 'width="1920" height="1032"' not in s:
              raise SystemExit('Full-resolution dimensions were not applied')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('script.js?v=healthcheck2', 'script.js?v=healthcheck-fullres')
          p.write_text(s, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/examples/full-health-check-before-fullres.webp
          test -f assets/examples/full-health-check-after-fullres.webp
          grep -q 'full-health-check-before-fullres.webp' script.js
          grep -q 'full-health-check-after-fullres.webp' script.js
          grep -q 'width="1920" height="1032"' script.js
          grep -q 'script.js?v=healthcheck-fullres' index.html
          rm -f .github/workflows/publish-fhc-fullres.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use full-resolution Full Health Check screenshots'
          git push origin HEAD:cdg-doctor-site
