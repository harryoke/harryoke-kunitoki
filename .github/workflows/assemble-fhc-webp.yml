name: Assemble Full Health Check web images

on:
  push:
    branches:
      - cdg-doctor-site
    paths:
      - '.github/workflows/assemble-fhc-webp.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: cdg-doctor-site
          fetch-depth: 0

      - name: Assemble and verify images
        shell: bash
        run: |
          set -euo pipefail
          cat assets/examples/fhc/before-0.txt assets/examples/fhc/before-1a.txt assets/examples/fhc/before-1b.txt assets/examples/fhc/before-2a.txt assets/examples/fhc/before-2b.txt assets/examples/fhc/before-3.txt assets/examples/fhc/before-4.txt assets/examples/fhc/before-5.txt | base64 -d > assets/examples/full-health-check-before.webp
          cat assets/examples/fhc/after-0a.txt assets/examples/fhc/after-0b.txt assets/examples/fhc/after-1.txt assets/examples/fhc/after-2.txt assets/examples/fhc/after-3.txt assets/examples/fhc/after-4a.txt assets/examples/fhc/after-4b.txt assets/examples/fhc/after-5.txt | base64 -d > assets/examples/full-health-check-after.webp
          echo '9ffa6402439b9f2733c3e687bb96c7d1705ec2d7e99565ade162db05f2c1de78  assets/examples/full-health-check-before.webp' | sha256sum -c -
          echo '51db3a2b93880847df0d757305fd0c1a6e949c20b9bdf66b08e139ce30dc4103  assets/examples/full-health-check-after.webp' | sha256sum -c -
          test "$(head -c 4 assets/examples/full-health-check-before.webp)" = 'RIFF'
          test "$(dd if=assets/examples/full-health-check-before.webp bs=1 skip=8 count=4 status=none)" = 'WEBP'
          test "$(head -c 4 assets/examples/full-health-check-after.webp)" = 'RIFF'
          test "$(dd if=assets/examples/full-health-check-after.webp bs=1 skip=8 count=4 status=none)" = 'WEBP'

      - name: Clean temporary transfer files
        shell: bash
        run: |
          rm -rf assets/examples/fhc
          rm -f assets/examples/full-health-check-before.webp.b64.txt
          rm -f assets/examples/full-health-check-after.webp.b64.txt
          rm -f assets/examples/full-health-check-example-snippet.html
          rm -f assets/examples/.placeholder.txt
          rm -f assets/examples/.blobtest.txt assets/examples/.blobtest2.txt assets/examples/.blobtest3.txt assets/examples/.blobtest4.txt assets/examples/.blobtest5.txt
          rm -f assets/examples/.blobroute-note.txt assets/examples/.native-blob-test.txt assets/examples/.do-not-use.txt assets/examples/.blob-api-route.txt
          rm -f assets/examples/.test-route-final.txt assets/examples/.cleanup-me.txt assets/examples/.last-temp-marker.txt assets/examples/.temp-direct-blob-note.txt
          rm -f assets/examples/.diagnostic-marker.txt assets/examples/.final-temp.txt assets/examples/.ignore.txt assets/examples/.route.txt assets/examples/.blob-test-content.txt
          rm -f .github/workflows/publish-full-health-check-example.yml
          rm -f .github/workflows/assemble-fhc-webp.yml

      - name: Commit verified web images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add verified Full Health Check interface screenshots'
          git push origin HEAD:cdg-doctor-site
