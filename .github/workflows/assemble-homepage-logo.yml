name: Apply supplied homepage logo

on:
  push:
    branches:
      - cdg-doctor-site

permissions:
  contents: write

jobs:
  apply-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: cdg-doctor-site
          fetch-depth: 0

      - name: Verify supplied image asset
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/hazzkaraoke-cdg-doctor-logo.webp
          test "$(stat -c%s assets/hazzkaraoke-cdg-doctor-logo.webp)" -eq 69056
          python - <<'PY'
          from pathlib import Path
          b = Path('assets/hazzkaraoke-cdg-doctor-logo.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          print('Logo asset verified.')
          PY

      - name: Replace generated hero logo with supplied artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''      <div class="hero-art" aria-label="HazzKaraoke CDG Doctor">
                <div class="hero-logo">
                  <span class="logo-hazz">HAZZ</span>
                  <span class="logo-karaoke">KARAOKE</span>
                  <span class="logo-doctor">CD+G DOCTOR</span>
                  <span class="logo-tag">It’s Alive, Alive!!</span>
                </div>
              </div>'''.replace('        ', '')
          new = '''      <div class="hero-art">
                <img
                  src="assets/hazzkaraoke-cdg-doctor-logo.webp"
                  alt="Hazz Karaoke CD+G Doctor"
                  width="450"
                  height="225"
                  style="display:block;width:min(100%,520px);height:auto;margin:0 auto;filter:drop-shadow(0 0 22px rgba(0,217,255,.24)) drop-shadow(0 0 34px rgba(255,73,0,.16))"
                >
              </div>'''.replace('        ', '')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one existing hero logo block; found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          assert 'assets/hazzkaraoke-cdg-doctor-logo.webp' in p.read_text(encoding='utf-8')
          print('Homepage hero updated.')
          PY

      - name: Commit homepage change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use supplied artwork as homepage hero logo"
          git push origin HEAD:cdg-doctor-site
